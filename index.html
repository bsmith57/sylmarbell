<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell Schedule + Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --bar: #111c33;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --line: #1e293b;
    --menu: #1a2540;
    --ticker-bg: #0b1324;
    --ticker-tag: #ffffff;
    --ticker-tag-ink: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Layout order ----------
     Default:  clock (top)  · countdown · ticker (bottom)
     .bottom:  ticker (top) · countdown · clock (bottom) */
  .topgroup { order: 0; flex: 0 0 auto; display: flex; flex-direction: column; }
  .stage    { order: 1; }
  .ticker   { order: 2; }
  body.bottom .topgroup { order: 2; flex-direction: column-reverse; }  /* period bar sits just above the clock */
  body.bottom .ticker   { order: 0; }

  /* ---------- Clock bar ---------- */
  .clockbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2vw;
    padding: 1.6vh 3vw;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  body.bottom .clockbar { border-bottom: 0; border-top: 1px solid var(--line); }

  .now { display: flex; align-items: baseline; gap: 1.2vw; }
  .label {
    font-size: clamp(12px, 1.3vw, 22px);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .time {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: clamp(40px, 9vh, 140px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .time .sec { color: var(--muted); font-size: .5em; margin-left: .15em; }
  .time .ampm { color: var(--accent); font-size: .38em; margin-left: .3em; letter-spacing: .05em; }

  .right { display: flex; align-items: center; gap: 2vw; }
  .date {
    font-size: clamp(16px, 2.6vh, 40px);
    color: var(--muted);
    text-align: right;
    line-height: 1.3;
  }
  .date strong { color: var(--ink); font-weight: 600; display: block; }

  /* ---------- Options menu ---------- */
  .options { position: relative; }
  .options-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 14px;
    font: 600 14px Inter, sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .options-btn:hover, .options-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--muted); }
  .options-btn .caret { font-size: 10px; transition: transform .15s; }
  .options-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    min-width: 280px;
    background: var(--menu);
    border: 1px solid #2b3a5c;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    z-index: 20;
    display: none;
  }
  .menu.open { display: block; }
  body.bottom .menu { top: auto; bottom: calc(100% + 8px); }

  .menu button {
    width: 100%;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--ink);
    font: 500 15px Inter, sans-serif;
    padding: 11px 12px;
    cursor: pointer;
    text-align: left;
  }
  .menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
  .menu .state { color: var(--muted); font-size: 13px; font-weight: 600; }
  .menu hr { border: 0; border-top: 1px solid #2b3a5c; margin: 4px 6px; }

  /* ---------- Countdown area ---------- */
  .stage { flex: 1 1 auto; position: relative; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  /* ---------- Built-in countdown ---------- */
  /* Stage colors follow bell.plus timing: more than 15 min, 15 min or less, 5 or less, 2 or less */
  .cd {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 1.6vh;
    background: var(--cd-bg); color: var(--cd-text);
    transition: background .8s ease, color .8s ease;
    overflow: hidden;
  }
  .cd[hidden] { display: none; }
  .cd-name { font-size: clamp(24px, 5.2vh, 76px); font-weight: 700; letter-spacing: -.01em; color: var(--cd-sub); }
  .cd-note {
    font-size: clamp(14px, 2.4vh, 32px); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--cd-sub); opacity: .75; margin-top: -.6vh;
  }
  .cd-note:empty { display: none; }
  .cd-time {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700; font-size: clamp(90px, 27vh, 400px); line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    color: var(--cd-digits);
    text-shadow: var(--cd-glow);
    transition: color .8s ease, text-shadow .8s ease;
  }
  .cd-bar {
    width: min(70vw, 1100px); height: clamp(8px, 1.3vh, 16px);
    background: var(--cd-track); border-radius: 999px; overflow: hidden; margin-top: 1vh;
  }
  .cd-fill { height: 100%; width: 0; background: var(--cd-digits); border-radius: 999px; transition: width 1s linear, background .8s ease; }
  .cd-sub { font-size: clamp(16px, 2.8vh, 40px); color: var(--cd-sub); opacity: .85; }
  .cd-sub b { font-weight: 700; opacity: 1; }
  .cd-tag {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 13px; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
    background: rgba(127,127,127,.18); color: var(--cd-sub); opacity: .8;
  }

  /* ---------- Lunch view: compact countdown + 3 entrée panels ---------- */
  .lunch {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--cd-bg); color: #f8fafc;
    transition: background .8s ease;
    overflow: hidden;
  }
  .lunch[hidden] { display: none; }
  .ln-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 2.2vw; padding: 1.8vh 3vw 1.4vh; }
  .ln-tag {
    font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: clamp(14px, 2.3vh, 30px);
    background: #fff; color: #0b1324; padding: .35em .9em; border-radius: 999px;
  }
  .ln-left {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 700;
    font-size: clamp(40px, 8vh, 110px); line-height: 1; letter-spacing: -.02em;
    color: var(--cd-digits); text-shadow: var(--cd-glow); font-variant-numeric: tabular-nums;
    transition: color .8s ease;
  }
  body.theme-blueslight .ln-left { color: var(--cd-digits); }
  .ln-sub { font-size: clamp(14px, 2.2vh, 28px); color: var(--cd-sub); opacity: .85; line-height: 1.3; }
  .ln-sub b { opacity: 1; font-weight: 700; }
  .ln-panels { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8vw; padding: 0 3vw 2vh; }
  .ln-panel {
    background: #14213d; border: 1px solid #23314f; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0; box-shadow: 0 14px 36px rgba(0,0,0,.35);
  }
  .ln-photo { position: relative; flex: 1 1 auto; min-height: 0; background: #0f1a33; overflow: hidden; }
  .ln-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ln-photo.logo { background: #fff; }
  .ln-photo.logo img { object-fit: contain; padding: 6% 10%; }
  .ln-rank, .ln-diet {
    position: absolute; top: 10px; font-weight: 700; font-size: clamp(11px, 1.6vh, 19px);
    padding: .35em .8em; border-radius: 999px; letter-spacing: .04em;
  }
  .ln-rank { left: 10px; background: rgba(11,19,36,.82); color: #fff; }
  .ln-diet { right: 10px; background: #16a34a; color: #fff; font-weight: 800; letter-spacing: .08em; }
  .ln-info { padding: 1.4vh 1.2vw 1.6vh; display: flex; flex-direction: column; gap: 1.1vh; }
  .ln-name { font-size: clamp(16px, 2.8vh, 38px); font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
             min-height: 2.3em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ln-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5vw; }
  .ln-m { background: rgba(255,255,255,.05); border: 1px solid #23314f; border-radius: 10px; padding: .8vh .4vw; text-align: center; }
  .ln-m .v { font-size: clamp(16px, 3vh, 40px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .ln-m .v small { font-size: .5em; font-weight: 700; color: #94a3b8; margin-left: .1em; }
  .ln-m .k { font-size: clamp(9px, 1.4vh, 17px); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; margin-top: .3vh; }
  .ln-m.protein { background: rgba(56,189,248,.14); border-color: rgba(56,189,248,.55); }
  .ln-m.protein .v, .ln-m.protein .k { color: #7dd3fc; }
  .ln-split { display: flex; height: 7px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); }
  .ln-split span { display: block; height: 100%; }
  .ln-legend { display: flex; gap: .9vw; font-size: clamp(9px, 1.3vh, 15px); color: #94a3b8; margin-top: -.4vh; }
  .ln-legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; }
  .ln-left.text { font-family: Inter, system-ui, sans-serif; font-size: clamp(30px, 5.6vh, 76px); font-weight: 800; letter-spacing: -.01em; color: #fff; text-shadow: none; }
  .ln-tag.bic    { background: #fde68a; color: #422006; }
  .ln-tag.supper { background: #c4b5fd; color: #2e1065; }
  .ln-close {
    margin-left: 1vw; background: rgba(255,255,255,.12); color: #e2e8f0; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: .45em 1em; font: 600 clamp(12px, 1.7vh, 18px) Inter, sans-serif; cursor: pointer;
  }
  .ln-close[hidden] { display: none; }
  .ln-rank.fruit { background: rgba(22,101,52,.9); }
  .ln-rank.grain { background: rgba(120,53,15,.9); }
  .ln-empty { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 3vh, 36px); color: #94a3b8; }

  /* Sylmar Sports panel (3rd panel during Supper): today's after-school sports + Educare activities */
  .ln-sports {
    background: linear-gradient(165deg, #2563eb 0%, #1e3a8a 42%, #0f1f4d 100%);
    border: 1px solid #3b82f6; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; min-height: 0;
    padding: 1.6vh 1.2vw 1.4vh; gap: .8vh; box-shadow: 0 14px 36px rgba(0,0,0,.35);
  }
  .sp-logo { height: clamp(70px, 15vh, 190px); width: auto; filter: drop-shadow(0 8px 16px rgba(0,0,0,.45)); flex: 0 0 auto; }
  .sp-tag { font-size: clamp(16px, 3vh, 38px); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; line-height: 1; flex: 0 0 auto; }
  .sp-list { width: 100%; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: .55vh; overflow: hidden; margin-top: .4vh; }
  .sp-row {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .8vw;
    background: rgba(11,19,36,.45); border: 1px solid rgba(147,197,253,.25); border-radius: 10px;
    padding: .55vh .7vw;
  }
  .sp-time {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: clamp(12px, 1.9vh, 24px); color: #0b1324; background: #bfdbfe; border-radius: 7px; padding: .25em .5em;
    min-width: 4.2em; text-align: center;
  }
  .sp-what { min-width: 0; }
  .sp-title { font-size: clamp(13px, 2.1vh, 27px); font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-where { font-size: clamp(10px, 1.55vh, 19px); color: #bfdbfe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-row.extra .sp-time { background: #fde68a; }
  .sp-lineup { font-size: clamp(10px, 1.55vh, 19px); color: #fde68a; font-weight: 600; line-height: 1.25; }
  .sp-more { text-align: center; font-size: clamp(11px, 1.6vh, 19px); color: #bfdbfe; }
  .sp-none { text-align: center; font-size: clamp(13px, 2vh, 24px); color: #bfdbfe; padding: 1vh 0; }

  /* "Today's menu" preview buttons in Options */
  .menu .mealrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; font: 500 15px Inter, sans-serif; color: var(--ink); white-space: nowrap; }
  .menu .mealrow .seg { display: flex; gap: 4px; }
  .menu .mealrow .seg button {
    width: auto; padding: 6px 10px; border-radius: 8px; font: 700 13px Inter, sans-serif;
    background: rgba(255,255,255,.08); border: 1px solid #2b3a5c; color: var(--ink); justify-content: center;
  }
  .menu .mealrow .seg button:hover { background: rgba(56,189,248,.2); }

  .cd-time.text { font-family: Inter, system-ui, sans-serif; font-size: clamp(48px, 14vh, 200px); letter-spacing: -.02em; }
  body.off-day .periods { display: none; }

  /* Gentle pulse in the last 2 minutes */
  body.stage-2 .cd-time { animation: cdPulse 1s ease-in-out infinite; }
  @keyframes cdPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @media (prefers-reduced-motion: reduce) { body.stage-2 .cd-time { animation: none; } }

  /* Theme 1: Blues - Dark (bell.plus colors: black background, colored digits) */
  body.theme-bluesdark { --cd-bg: #000; --cd-sub: #fff; --cd-track: #222; --cd-glow: none; }
  body.theme-bluesdark.stage-calm { --cd-digits: #ccffff; }
  body.theme-bluesdark.stage-15   { --cd-digits: #33ccff; }
  body.theme-bluesdark.stage-5    { --cd-digits: #0066ff; }
  body.theme-bluesdark.stage-2    { --cd-digits: #002db3; --cd-glow: 0 0 .06em #3b82f6; }  /* faint glow so the darkest blue still reads on black */

  /* Theme 2: Sylmar Glow (navy, with a blue glow that brightens as the bell gets close) */
  body.theme-glow { --cd-sub: #e2e8f0; --cd-track: rgba(255,255,255,.12); --cd-digits: #ffffff; }
  body.theme-glow.stage-calm { --cd-bg: radial-gradient(ellipse at 50% 45%, #1b3370 0%, #0b1324 65%); --cd-glow: 0 0 .25em rgba(59,130,246,.35); }
  body.theme-glow.stage-15   { --cd-bg: radial-gradient(ellipse at 50% 45%, #1d4ed8 0%, #0b1324 70%); --cd-glow: 0 0 .25em rgba(96,165,250,.55); }
  body.theme-glow.stage-5    { --cd-bg: radial-gradient(ellipse at 50% 45%, #0284c7 0%, #0b1a3a 72%); --cd-glow: 0 0 .3em rgba(56,189,248,.75); }
  body.theme-glow.stage-2    { --cd-bg: radial-gradient(ellipse at 50% 45%, #22d3ee 0%, #0c4a6e 55%, #0b1324 85%); --cd-glow: 0 0 .35em rgba(255,255,255,.9); }

  /* Theme 3: Blues - Light (bell.plus colors as the background) */
  body.theme-blueslight { --cd-glow: none; --cd-track: rgba(0,0,0,.15); }
  body.theme-blueslight.stage-calm { --cd-bg: #ccffff; --cd-digits: #0b1324; --cd-sub: #0b1324; }
  body.theme-blueslight.stage-15   { --cd-bg: #33ccff; --cd-digits: #0b1324; --cd-sub: #0b1324; }
  body.theme-blueslight.stage-5    { --cd-bg: #0066ff; --cd-digits: #ffffff; --cd-sub: #ffffff; --cd-track: rgba(255,255,255,.25); }
  body.theme-blueslight.stage-2    { --cd-bg: #002db3; --cd-digits: #ffffff; --cd-sub: #ffffff; --cd-track: rgba(255,255,255,.25); }

  /* ---------- Announcement ticker ---------- */
  .ticker {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    background: var(--ticker-bg);
    border-top: 1px solid var(--line);
    height: clamp(44px, 7vh, 96px);
    overflow: hidden;
  }
  body.bottom .ticker { border-top: 0; border-bottom: 1px solid var(--line); }
  body.no-ticker .ticker, .ticker.empty { display: none; }

  .ticker-tag {
    flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 2vw;
    background: var(--ticker-tag);
    color: var(--ticker-tag-ink);
    font-weight: 700;
    font-size: clamp(13px, 2vh, 26px);
    letter-spacing: .1em;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }
  .ticker-tag::after {   /* angled edge */
    content: "";
    position: absolute; left: calc(100% - 2px); top: 0; bottom: 0; width: 20px;  /* overlaps the box by 2px so no seam shows */
    background: var(--ticker-tag);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  .ticker-track {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
  }
  .ticker-run {
    position: absolute; top: 0; bottom: 0; left: 0;
    display: flex; align-items: center;
    white-space: nowrap;
    will-change: transform;
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    padding-left: 30px;
  }
  .ticker-track { touch-action: pan-y; }            /* horizontal swipes go to the ticker, vertical still scrolls */
  .ticker.dragging .ticker-run { cursor: grabbing; }
  .ticker.held .ticker-tag { background: #e2e8f0; }  /* subtle cue while paused by a drag */
  .ticker.held .ticker-tag::after { background: #e2e8f0; }

  .item {
    display: inline-flex; align-items: center; gap: .6em;
    font-size: clamp(18px, 3.4vh, 46px);
    font-weight: 500;
    padding-right: 1.4em;
  }
  .item::after {          /* separator */
    content: "\2022";
    color: var(--accent);
    margin-left: 1.4em;
  }
  .badge {
    font-size: .5em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: .35em .7em; border-radius: 999px;
    background: rgba(255,255,255,.1); color: var(--muted);
  }
  .badge.icon {
    background: rgba(255,255,255,.12);
    font-size: .8em; letter-spacing: 0;
    padding: .12em .35em;
    line-height: 1.2;
  }
  .badge.ig {
    background: linear-gradient(45deg, #f58529, #dd2a7b 50%, #8134af);
    color: #fff;
  }

  /* ---------- Period bar ---------- */
  .periods {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    background: #ffffff;
    border-bottom: 2px solid var(--bar);
  }
  body.bottom .periods { border-bottom: 0; border-top: 2px solid var(--bar); }
  body.no-periods .periods, .periods:empty { display: none; }
  .pbox {
    display: flex; align-items: center; justify-content: center; gap: .45em;
    padding: .55vh .6vw;
    min-height: clamp(34px, 5.2vh, 70px);
    color: var(--bar);
    font-size: clamp(14px, 2.7vh, 38px);
    font-variant-numeric: tabular-nums;
    border-left: 1px solid #cbd5e1;
    white-space: nowrap;
    position: relative;
  }
  .pbox:first-child { border-left: 0; }
  .pbox .pl { font-weight: 700; }
  .pbox .pt { font-weight: 500; }
  .pbox.past { color: #94a3b8; }
  .pbox.now  { background: #9ca3af; color: #0b1324; }
  .pbox.now .pt { font-weight: 700; }
  .pbox.next { box-shadow: inset 0 0 0 3px #9ca3af; }   /* during passing period: outline the upcoming class */

  /* ---------- Smaller clock ---------- */
  body.compact .clockbar { padding: .8vh 2vw; }
  body.compact .time { font-size: clamp(28px, 5.5vh, 80px); }
  body.compact .date { font-size: clamp(13px, 1.8vh, 26px); }
  body.compact .pbox { font-size: clamp(12px, 2vh, 28px); min-height: clamp(28px, 4vh, 54px); }

  /* ---------- Phones (narrow screens): clock + countdown only ---------- */
  @media (max-width: 700px) {
    .periods, #mPer { display: none !important; }
    /* Ticker on phones: "Announcements" label on its own line, scrolling text full width below */
    .ticker { flex-direction: column; height: auto; }
    .ticker-tag { padding: 4px 12px; font-size: 11px; letter-spacing: .14em; justify-content: flex-start; }
    .ticker-tag::after { display: none; }
    .ticker-track { flex: 0 0 auto; height: 40px;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
    .ticker-run { padding-left: 12px; }
    .item { font-size: 17px; }
    .clockbar { padding: 10px 14px; gap: 10px; }
    .now { gap: 8px; }
    .label { display: none; }
    .time, body.compact .time { font-size: clamp(30px, 11vw, 56px); }
    .right { gap: 10px; }
    .date, body.compact .date { font-size: 13px; line-height: 1.25; }
    .options-btn { padding: 6px 10px; font-size: 13px; }
    .menu { min-width: 210px; }
    .date { white-space: nowrap; }
    .cd-time { font-size: 25vw; }
    .cd-time.text { font-size: 13vw; }
    .cd-bar { width: 84vw; }
    .cd-tag { white-space: normal; width: 90%; text-align: center; }
    /* Meal view on phones: three compact cards stacked vertically, scrollable by touch */
    .lunch { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
    .ln-top { flex-wrap: wrap; gap: 6px 12px; padding: 10px 12px 8px; }
    .ln-tag { font-size: 13px; }
    .ln-left { font-size: 40px; }
    .ln-left.text { font-size: 28px; }
    .ln-sub { font-size: 13px; }
    .ln-close { font-size: 12px; margin-left: 0; }
    .ln-panels { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 16px; flex: 0 0 auto; min-height: auto; }
    .ln-panel { flex-direction: row; flex: 0 0 auto; min-height: 0; border-radius: 12px; }
    .ln-photo { flex: 0 0 32%; min-height: 112px; }
    .ln-photo.logo img { padding: 8%; }
    .ln-info { flex: 1 1 auto; min-width: 0; padding: 10px 12px; gap: 7px; justify-content: center; }
    .ln-name { font-size: 16px; min-height: 0; -webkit-line-clamp: 2; }
    .ln-macros { gap: 5px; }
    .ln-m { padding: 5px 2px; border-radius: 8px; }
    .ln-m .v { font-size: 17px; }
    .ln-m .k { font-size: 9px; letter-spacing: .05em; margin-top: 1px; }
    .ln-split { height: 5px; }
    .ln-legend, .ln-rank, .ln-diet { display: none; }
    .ln-sports { flex: 0 0 auto; padding: 12px; gap: 8px; border-radius: 12px; }
    .sp-logo { height: 54px; }
    .sp-tag { font-size: 18px; }
    .sp-list { overflow: visible; gap: 6px; margin-top: 2px; }
    .sp-row { padding: 6px 8px; gap: 10px; }
    .sp-time { font-size: 13px; }
    .sp-title { font-size: 14px; }
    .sp-where { font-size: 11px; }
    .ln-empty { padding: 24px 0; font-size: 16px; }
  }
  /* Phones held sideways (short screens): drop the photo labels and the Spartan logo, and let the
     sports list scroll by touch */
  @media (max-height: 500px) and (min-width: 701px) {
    .ln-rank, .ln-diet, .ln-legend, .sp-logo { display: none; }
    .ln-top { padding: 6px 2vw 4px; }
    .ln-panels { padding-bottom: 8px; gap: 1.4vw; }
    .ln-info { padding: 6px 10px 8px; gap: 5px; }
    .ln-name { font-size: 15px; min-height: 2.3em; }
    .ln-m { padding: 3px 2px; }
    .ln-m .v { font-size: 15px; }
    .ln-m .k { font-size: 8px; letter-spacing: .04em; }
    .ln-sports { padding: 8px 8px 6px; gap: 6px; }
    .sp-tag { font-size: 15px; }
    .sp-list { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
    .sp-row { flex: 0 0 auto; padding: 4px 6px; }
    .sp-time { font-size: 12px; }
    .sp-title { font-size: 13px; }
    .sp-where { font-size: 10px; }
  }

  @media (max-width: 380px) {
    .date { display: none; }   /* very small phones: time and Options only */
  }

  // ================= Saved preferences (per browser) =================
  // Defaults: seconds shown, larger clock, clock at top, announcements on
  // Defaults for every board: seconds shown, larger clock, clock at top, ticker and period bar on,
  // built-in countdown in Blues - Dark. Each board can change these in Options.
  const THEMES = [
    { id: "bluesdark",  name: "Blues - Dark" },
    { id: "glow",       name: "Sylmar Glow" },
    { id: "blueslight", name: "Blues - Light" }
  ];
  const DEFAULT_THEME = "bluesdark";
  let schoolDays = {};     // "MM/DD/YYYY" -> { school: true/false, reason }
  let dailyItems = [];     // today's calendar items for the ticker: [{ time, title, where }]
  const prefs = { sec: true, compact: false, bottom: false, ticker: true, periods: true, food: true, theme: DEFAULT_THEME, builtin: true };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("bc-prefs") || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem("bc-prefs", JSON.stringify(prefs)); } catch (e) {} }

  // ================= Clock =================
  const timeEl = document.getElementById("time");
  const dateEl = document.getElementById("date");
  function pad(n) { return String(n).padStart(2, "0"); }
  const phoneMQ = window.matchMedia("(max-width: 700px)");   // phone layout: no period bar or ticker

  function tick() {
    const d = new Date();
    let h = d.getHours();
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    timeEl.innerHTML =
      h + ":" + pad(d.getMinutes()) +
      (prefs.sec ? '<span class="sec">:' + pad(d.getSeconds()) + "</span>" : "") +
      '<span class="ampm">' + ampm + "</span>";
    dateEl.innerHTML =
      "<strong>" + d.toLocaleDateString(undefined, { weekday: "long" }) + "</strong>" +
      d.toLocaleDateString(undefined, { month: phoneMQ.matches ? "short" : "long", day: "numeric", year: "numeric" });
    updatePeriods(d);
    countdownTick(d);
  }

  // ================= Options menu =================
  const optBtn = document.getElementById("optBtn");
  const menu = document.getElementById("menu");

  function apply() {
    document.body.classList.toggle("compact", prefs.compact);
    document.body.classList.toggle("bottom", prefs.bottom);
    document.body.classList.toggle("no-ticker", !prefs.ticker);
    document.getElementById("sSec").textContent  = prefs.sec ? "Shown" : "Hidden";
    document.getElementById("sSize").textContent = prefs.compact ? "Smaller" : "Larger";
    document.getElementById("sPos").textContent  = prefs.bottom ? "Bottom" : "Top";
    document.getElementById("sTick").textContent = prefs.ticker ? "On" : "Off";
    document.body.classList.toggle("no-periods", !prefs.periods);
    document.getElementById("sPer").textContent = prefs.periods ? "On" : "Off";
    if (!THEMES.some(t => t.id === prefs.theme)) prefs.theme = DEFAULT_THEME;
    THEMES.forEach(t => document.body.classList.toggle("theme-" + t.id, t.id === prefs.theme));
    document.getElementById("sTheme").textContent = THEMES.find(t => t.id === prefs.theme).name;
    document.getElementById("sSrc").textContent = prefs.builtin ? "Built-in" : "bell.plus";
    document.getElementById("sFood").textContent = prefs.food ? "On" : "Off";
    if (typeof chooseCountdown === "function") chooseCountdown();
    document.getElementById("fsLabel").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
    tick();
  }

  function setMenu(open) {
    menu.classList.toggle("open", open);
    optBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  optBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); });
  menu.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

  document.getElementById("mSec").onclick  = () => { prefs.sec = !prefs.sec; save(); apply(); };
  document.getElementById("mSize").onclick = () => { prefs.compact = !prefs.compact; save(); apply(); };
  document.getElementById("mPos").onclick  = () => { prefs.bottom = !prefs.bottom; save(); apply(); };
  document.getElementById("mTheme").onclick = () => {
    const i = THEMES.findIndex(t => t.id === prefs.theme);
    prefs.theme = THEMES[(i + 1) % THEMES.length].id; save(); apply();
  };
  document.getElementById("mSrc").onclick = () => { prefs.builtin = !prefs.builtin; save(); apply(); };
  document.getElementById("mFood").onclick = () => { prefs.food = !prefs.food; save(); apply(); };
  menu.querySelectorAll(".mealrow [data-meal]").forEach(b => b.onclick = () => { setMenu(false); startPreview(b.dataset.meal); });
  document.getElementById("mPer").onclick = () => { prefs.periods = !prefs.periods; save(); apply(); };
  document.getElementById("mTick").onclick = () => { prefs.ticker = !prefs.ticker; save(); apply(); if (prefs.ticker) renderTicker(); };
  document.getElementById("mFs").onclick = async () => {
    setMenu(false);
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();

  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; };
  const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;
  const cleanOff = r => String(r || "").replace(/^\s*no school\s*[-–:]*\s*/i, "").trim();
  function isSchoolDay(d) {
    const sd = schoolDays[dayKey(d)];
    return sd ? sd.school : !isWeekend(d);           // no data: weekdays count as school days
  }
  function offTodayInfo() {
    if (!Object.keys(schoolDays).length) return null;  // calendar not loaded: never guess
    const d = new Date();
    if (isSchoolDay(d)) return null;
    const sd = schoolDays[dayKey(d)];
    return { reason: isWeekend(d) ? "Weekend" : cleanOff(sd && sd.reason) || "No School" };
  }
  // Next school day after today, plus the reasons for any weekday days off in between
  function nextSchoolDay() {
    const today = new Date(), offs = [];
    for (let i = 1; i <= 120; i++) {
      const d = addDays(today, i);
      if (isSchoolDay(d)) return { date: d, days: i, offs };
      if (!isWeekend(d)) offs.push({ date: d, reason: (schoolDays[dayKey(d)] || {}).reason || "" });
    }
    return null;
  }
  function breakLabel(offs) {
    const all = offs.map(o => o.reason).join(" | ");
    if (/thanksgiving/i.test(all)) return { kind: "break", name: "Thanksgiving Break" };
    if (/winter|christmas|new year/i.test(all)) return { kind: "break", name: "Winter Break" };
    if (/spring/i.test(all)) return { kind: "break", name: "Spring Break" };
    const names = [...new Set(offs.map(o => cleanOff(o.reason)).filter(n => n && !/unassigned|pupil[- ]free|no school/i.test(n)))];
    if (names.length === 1) return { kind: "holiday", name: names[0] };
    return offs.length ? { kind: "generic" } : null;
  }
  // context "after": after the last bell on a school day; "off": on a day with no school
  function backMessage(context) {
    const nx = nextSchoolDay();
    if (!nx) return "See you soon, Spartans";
    const when = nx.date.toLocaleDateString(undefined, { weekday: "long" }) + ", " + (nx.date.getMonth() + 1) + "/" + nx.date.getDate();
    const lbl = breakLabel(nx.offs);
    if (context === "after" && nx.days === 1) return "See you tomorrow, Spartans";
    if (!lbl) return (context === "after" ? "Have a great weekend! " : "") + "See you back <b>" + when + "</b>";
    if (lbl.kind === "break") return "Happy " + esc(lbl.name) + "! See you back <b>" + when + "</b>";
    const first = nx.offs[0].date;
    const firstWord = context === "after" && dayKey(first) === dayKey(addDays(new Date(), 1)) ? "tomorrow" : first.toLocaleDateString(undefined, { weekday: "long" });
    if (lbl.kind === "holiday") return "No school " + firstWord + " for " + esc(lbl.name) + ". See you back <b>" + when + "</b>!";
    return "No school " + firstWord + ". See you back <b>" + when + "</b>";
  }
  // Ticker note on the last school day before days off, e.g. "No school tomorrow: Veteran's Day"
  function tomorrowNotice() {
    if (offTodayInfo()) return null;
    const nx = nextSchoolDay();
    if (!nx || !nx.offs.length) return null;
    const lbl = breakLabel(nx.offs);
    const first = nx.offs[0].date;
    const word = dayKey(first) === dayKey(addDays(new Date(), 1)) ? "tomorrow" : first.toLocaleDateString(undefined, { weekday: "long" });
    const back = nx.date.toLocaleDateString(undefined, { weekday: "short" }) + " " + (nx.date.getMonth() + 1) + "/" + nx.date.getDate();
    return "No school " + word + (lbl && lbl.name ? ": " + lbl.name : "") + " · back " + back;
  }

  function chooseCountdown() {
    const useBuiltIn = (prefs.builtin && (segments.length > 0 || !!offTodayInfo())) || (DEMO && segments.length > 0) ||
                       (typeof previewMeal !== "undefined" && !!previewMeal);
    cdEl.hidden = !useBuiltIn;
    if (useBuiltIn) {
      if (frame) { frame.remove(); frame = null; }
    } else if (!frame && !DEMO && (scheduleChecked || !PERIODS_TAB || !ANNOUNCEMENTS_SHEET_ID)) {
      frame = document.createElement("iframe");
      frame.src = BELL_URL;
      frame.title = "Bell schedule countdown";
      frame.allow = "autoplay; fullscreen";
      stage.appendChild(frame);
    }
  }

  function fmtLeft(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = sec % 60;
    return h > 0 ? h + ":" + pad(m) + ":" + pad(s2) : m + ":" + pad(s2);
  }
  function splitName(name) {          // "Period 2 (ATTENDANCE @ 32)" -> ["Period 2", "ATTENDANCE @ 32"]
    const m = String(name).match(/^(.*?)\s*[\(\{]([^\)\}]*)[\)\}]\s*$/);
    return m && m[1] ? [m[1], m[2]] : [name, ""];
  }
  let lastStage = "";
  function setStage(st) {
    if (st === lastStage) return;
    ["calm", "15", "5", "2"].forEach(x => document.body.classList.toggle("stage-" + x, x === st));
    lastStage = st;
  }

  function countdownTick(d) {
    const off = offTodayInfo();
    document.body.classList.toggle("off-day", !!off);
    if (cdEl.hidden) return;
    if (off && !previewMeal) {                 // holiday, break or weekend: no countdown, show when we're back
      showMeal(null);
      const nx = nextSchoolDay();
      cd.name.textContent = "No School Today";
      cd.note.textContent = off.reason === "Weekend" ? "" : off.reason;
      cd.time.classList.add("text");
      cd.time.textContent = nx ? "Back " + nx.date.toLocaleDateString(undefined, { weekday: "short" }) + " " + (nx.date.getMonth() + 1) + "/" + nx.date.getDate() : "\u2014";
      cd.sub.innerHTML = backMessage("off");
      cd.fill.style.width = "0%";
      setStage("calm");
      document.title = "No School Today";
      return;
    }
    cd.time.classList.remove("text");
    const t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000;
    if (!segments.length && !previewMeal) return;
    const first = segments[0], last = segments[segments.length - 1];
    let seg = segments.find(x => t >= x.s && t < x.e), name, note = "", endMin, startMin, sub;
    if (seg && seg.kind === "free") seg = null;   // "Free" at the end of the day = school's out
    if (!segments.length) {
      name = ""; endMin = null;
    } else if (seg) {
      [name, note] = splitName(seg.name);
      endMin = seg.e; startMin = seg.s;
      const nxt = segments.find(x => x.s >= seg.e && x.kind !== "passing" && x.kind !== "free");
      sub = nxt ? "Bell at <b>" + fmt12(endMin) + "</b> · then " + esc(splitName(nxt.name)[0]) : "Ends at <b>" + fmt12(endMin) + "</b>";
    } else if (t < first.s && first.kind !== "free") {
      name = "School starts soon"; endMin = first.s; startMin = Math.max(0, first.s - 60);
      sub = esc(splitName(first.name)[0]) + " begins at <b>" + fmt12(first.s) + "</b>";
    } else {
      name = "School's out"; endMin = null;
    }
    // ---- Food menu phases (or a preview chosen in Options) ----
    const classes = segments.filter(x => x.kind === "class");
    let meal = null, mealLeft = null, mealSub = "", mealText = "";
    if (previewMeal) {
      meal = previewMeal; mealText = "Today's menu";
      mealSub = "Preview · closes in " + Math.max(0, Math.ceil((previewUntil - Date.now()) / 1000)) + "s";
    } else if (prefs.food && classes.length && !off) {
      const firstS = classes[0].s, lastE = classes[classes.length - 1].e;
      if (seg && /\blunch\b/i.test(seg.name)) {
        meal = "Lunch"; mealLeft = (endMin - t) * 60; mealSub = sub.replace(" · then ", "<br>then ");
      } else if (t >= firstS - BIC_MINUTES_BEFORE && t < firstS) {
        meal = "BIC"; mealLeft = (firstS - t) * 60;
        mealSub = esc(splitName(classes[0].name)[0]) + " begins<br>at <b>" + fmt12(firstS) + "</b>";
      } else if (t >= lastE && t < lastE + SUPPER_MINUTES_AFTER) {
        meal = "Supper"; mealText = "After school";
        mealSub = seg && seg.kind === "break" ? esc(splitName(seg.name)[0]) + " until <b>" + fmt12(seg.e) + "</b>" : "Afterschool meal";
      }
      if (meal && !mealHasItems(meal)) meal = null;
    }
    showMeal(meal);
    if (meal) {
      lunchEls.left.classList.toggle("text", mealLeft == null);
      lunchEls.left.textContent = mealLeft == null ? mealText : fmtLeft(mealLeft);
      lunchEls.sub.innerHTML = mealSub;
      if (mealLeft != null) {
        const lm = mealLeft / 60;
        setStage(lm <= 2 ? "2" : lm <= 5 ? "5" : lm <= 15 ? "15" : "calm");
        document.title = fmtLeft(mealLeft) + " | " + MEAL_LABEL[meal];
      } else { setStage("calm"); document.title = MEAL_LABEL[meal] + " menu"; }
      return;
    }
    cd.name.textContent = name;
    cd.note.textContent = note;
    if (endMin == null) {
      const nxo = nextSchoolDay();
      if (nxo && nxo.days > 1 && Object.keys(schoolDays).length) {      // weekend or days off ahead: show when we're back
        cd.time.classList.add("text");
        cd.time.textContent = "Back " + nxo.date.toLocaleDateString(undefined, { weekday: "short" }) + " " + (nxo.date.getMonth() + 1) + "/" + nxo.date.getDate();
      } else cd.time.textContent = "\u2014";
      cd.fill.style.width = "100%"; cd.sub.innerHTML = backMessage("after"); setStage("calm"); return;
    }
    const leftSec = (endMin - t) * 60;
    cd.time.textContent = fmtLeft(leftSec);
    cd.sub.innerHTML = sub;
    const total = Math.max(1, endMin - startMin);
    cd.fill.style.width = Math.min(100, Math.max(0, ((t - startMin) / total) * 100)) + "%";
    const leftMin = leftSec / 60;
    setStage(leftMin <= 2 ? "2" : leftMin <= 5 ? "5" : leftMin <= 15 ? "15" : "calm");
    document.title = fmtLeft(leftSec) + " | " + name;
  }

  // ---- Meal view (BIC / Lunch / Supper) ----
  const lunchEl = document.getElementById("lunch");
  const lunchEls = { tag: document.getElementById("lnTag"), left: document.getElementById("lnLeft"), sub: document.getElementById("lnSub"),
                     panels: document.getElementById("lnPanels"), close: document.getElementById("lnClose") };
  const MEAL_LABEL = { BIC: "BIC", Lunch: "Lunch", Supper: "Supper" };
  let foodMenus = { BIC: [], Lunch: [], Supper: [] };   // today's dishes per meal: [{name, img, kcal, carbs, protein, fat}]
  let shownMeal = null, previewMeal = null, previewUntil = 0, previewTimer = null;
  let sportsEvents = [];   // today's: [{s, e, title, where}] (minutes after midnight)

  const dishName = n => String(n).replace(/\s*\bPREP\b\s*/gi, " ").replace(/\s*\bVEGAN\b\s*/gi, " ").replace(/\s+/g, " ").trim();
  const isPrep = d => /\bPREP\b/i.test(d.name);
  const byProtein = (a, b) => b.protein - a.protein;
  const FRUIT_RE = /\b(fruit|apple|applesauce|orange|banana|peach|peaches|pear|grape|grapes|berr|melon|mango|pineapple|raisin|juice|clementine|mandarin)/i;
  const GRAIN_RE = /\b(cereal|bagel|muffin|pancake|waffle|toast|biscuit|loaf|bar|granola|oatmeal|roll|bread|tortilla|croissant|grain)/i;

  // Lunch: main entrées with real protein; this school's PREP line first; most protein first
  function pickLunch(menu) {
    const ok = d => d.protein >= ENTREE_MIN_PROTEIN && d.kcal >= ENTREE_MIN_KCAL;
    return menu.filter(d => ok(d) && isPrep(d)).sort(byProtein).concat(menu.filter(d => ok(d) && !isPrep(d)).sort(byProtein))
      .slice(0, 3).map((d, i) => ({ d, rank: i === 0 ? "Most protein" : "Entrée " + (i + 1) }));
  }
  // BIC: the protein entrée, the main grain (PREP first, then cereal bowl / other grains), and a fruit
  function pickBIC(menu) {
    const items = menu.filter(d => d.kcal > 0);
    const fruits = items.filter(d => FRUIT_RE.test(d.name));
    const fruit = fruits.find(d => /fresh fruit/i.test(d.name)) || fruits.find(d => !/juice/i.test(d.name)) || fruits[0];
    const rest = items.filter(d => !FRUIT_RE.test(d.name) && d.kcal >= 100);
    const entree = rest.filter(d => !/cereal/i.test(d.name)).sort(byProtein)[0];
    const grains = rest.filter(d => d !== entree);
    const grain = grains.find(d => isPrep(d) && GRAIN_RE.test(d.name)) || grains.find(d => /cereal/i.test(d.name)) ||
                  grains.find(d => GRAIN_RE.test(d.name)) || grains.sort((a, b) => b.carbs - a.carbs)[0];
    return [entree && { d: entree, rank: "Entrée" }, grain && { d: grain, rank: "Grain", cls: "grain" }, fruit && { d: fruit, rank: "Fruit", cls: "fruit" }].filter(Boolean);
  }
  // Supper: the two items with the most protein (3rd panel is the Educare spotlight)
  function pickSupper(menu) {
    return menu.filter(d => d.kcal > 0 && d.protein > 0).sort(byProtein).slice(0, 2)
      .map((d, i) => ({ d, rank: i === 0 ? "Most protein" : "Also today" }));
  }
  const PICKERS = { BIC: pickBIC, Lunch: pickLunch, Supper: pickSupper };
  function mealHasItems(meal) { return PICKERS[meal](foodMenus[meal] || []).length > 0; }

  function dishPanel(p) {
    const d = p.d, rnd = x => Math.round(+x || 0);
    const pc = d.protein * 4, cc = d.carbs * 4, fc = d.fat * 9, tot = pc + cc + fc || 1;
    const photo = d.img
      ? '<div class="ln-photo"><img src="' + esc(d.img) + '" alt="' + esc(dishName(d.name)) + '" onerror="this.onerror=null;this.src=CAFE_LA_LOGO;this.parentNode.classList.add(\'logo\')">'
      : '<div class="ln-photo logo"><img src="' + CAFE_LA_LOGO + '" alt="Cafe LA">';
    return '<article class="ln-panel">' + photo +
        '<span class="ln-rank ' + (p.cls || "") + '">' + p.rank + '</span>' +
        (/\bVEGAN\b/i.test(d.name) ? '<span class="ln-diet">VEGAN</span>' : '') + '</div>' +
      '<div class="ln-info"><div class="ln-name" title="' + esc(dishName(d.name)) + '">' + esc(dishName(d.name)) + '</div>' +
        '<div class="ln-macros">' +
          '<div class="ln-m"><div class="v">' + rnd(d.kcal) + '</div><div class="k">kCal</div></div>' +
          '<div class="ln-m protein"><div class="v">' + rnd(d.protein) + '<small>g</small></div><div class="k">Protein</div></div>' +
          '<div class="ln-m"><div class="v">' + rnd(d.carbs) + '<small>g</small></div><div class="k">Carbs</div></div>' +
          '<div class="ln-m"><div class="v">' + rnd(d.fat) + '<small>g</small></div><div class="k">Fat</div></div>' +
        '</div>' +
        '<div class="ln-split"><span style="background:#38bdf8;width:' + (pc / tot * 100) + '%"></span><span style="background:#e2e8f0;width:' + (cc / tot * 100) + '%"></span><span style="background:#64748b;width:' + (fc / tot * 100) + '%"></span></div>' +
        '<div class="ln-legend"><span><i style="background:#38bdf8"></i>Protein</span><span><i style="background:#e2e8f0"></i>Carbs</span><span><i style="background:#64748b"></i>Fat</span><span style="margin-left:auto">share of calories</span></div>' +
      '</div></article>';
  }
  // "G Basketball Practice - Permit" -> "Girls Basketball Practice"
  function sportTitle(t) {
    return String(t).replace(/\s*-\s*Permit\b/i, "").replace(/^G\s+/, "Girls ").replace(/^B\s+/, "Boys ")
      .replace(/^V\s+/, "Varsity ").replace(/\s+/g, " ").trim();
  }
  function sportsPanel() {
    const classes = segments.filter(x => x.kind === "class");
    const cutoff = DEMO ? 15 * 60 + 23 : classes.length ? classes[classes.length - 1].e : 15 * 60;   // mockup uses the real 3:23 bell
    const dow = new Date().getDay();
    const events = sportsEvents.filter(ev => ev.e > cutoff).sort((a, b) => a.s - b.s || a.title.localeCompare(b.title))
      .map(ev => ({ time: fmt12(ev.s), title: sportTitle(ev.title), where: ev.where, extra: false }));
    const extras = EXTRA_ACTIVITIES.filter(x => !x.days || x.days.includes(dow))
      .map(x => ({ time: fmt12(toMin(x.start)), title: x.title, where: x.where, extra: true,
                   lineup: (x.lineup && x.lineup[dow]) || [] }));
    const all = events.concat(extras);
    const shown = all.slice(0, SPORTS_MAX_ROWS);
    const rows = shown.map(r => '<div class="sp-row' + (r.extra ? ' extra' : '') + '"><span class="sp-time">' + r.time + '</span>' +
      '<div class="sp-what"><div class="sp-title">' + esc(r.title) + '</div>' + (r.where ? '<div class="sp-where">' + esc(r.where) + '</div>' : '') +
      (r.lineup && r.lineup.length ? '<div class="sp-lineup">' + r.lineup.map(esc).join(" \u00b7 ") + '</div>' : '') + '</div></div>').join("");
    return '<article class="ln-sports"><img class="sp-logo" src="' + SPORTS_LOGO + '" alt="Sylmar Spartans">' +
      '<div class="sp-tag">Sylmar Sports</div><div class="sp-list">' +
      (rows || '<div class="sp-none">No games or practices listed today</div>') +
      (all.length > shown.length ? '<div class="sp-more">+' + (all.length - shown.length) + ' more</div>' : '') +
      '</div></article>';
  }

  function renderMeal(meal) {
    const picks = PICKERS[meal](foodMenus[meal] || []);
    lunchEls.tag.textContent = MEAL_LABEL[meal];
    lunchEls.tag.className = "ln-tag " + (meal === "Lunch" ? "" : meal.toLowerCase());
    let html = picks.map(dishPanel).join("");
    if (meal === "Supper") html += sportsPanel();
    if (!picks.length) html = '<div class="ln-empty">No ' + MEAL_LABEL[meal] + ' menu posted for today</div>';
    lunchEls.panels.innerHTML = html;
  }
  function showMeal(meal) {
    if (meal !== shownMeal) { if (meal) renderMeal(meal); shownMeal = meal; }
    lunchEls.close.hidden = !previewMeal;
    if (lunchEl.hidden === !meal) return;
    lunchEl.hidden = !meal;
    cdEl.style.visibility = meal ? "hidden" : "";
  }
  function startPreview(meal) {
    previewMeal = meal; previewUntil = Date.now() + PREVIEW_SECONDS * 1000; shownMeal = null;
    chooseCountdown();   // a preview always uses the built-in area, even where bell.plus is showing
    clearTimeout(previewTimer);
    previewTimer = setTimeout(stopPreview, PREVIEW_SECONDS * 1000);
    tick();
  }
  function stopPreview() {
    previewMeal = null; clearTimeout(previewTimer);
    showMeal(null); chooseCountdown(); tick();
  }
  lunchEls.close.onclick = stopPreview;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && previewMeal) stopPreview(); });

  function setFoodMenus(menus) { foodMenus = Object.assign({ BIC: [], Lunch: [], Supper: [] }, menus); shownMeal = null; }

  async function loadSportsFromSheet() {
    try {
      const [header, ...rows] = await loadSheetTab(SPORTS_TAB);
      const h = header.map(x => x.toLowerCase());
      const c = n => h.indexOf(n);
      const d = new Date();
      const todayKey = pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear();
      const list = rows.filter(r => (r[c("date")] || "").trim() === todayKey && (r[c("title")] || "").trim() && (r[c("start")] || "").trim())
        .map(r => ({ s: toMin(r[c("start")]), e: toMin(r[c("end")]), title: r[c("title")].trim(), where: (r[c("location")] || "").trim() }))
        .filter(x => !isNaN(x.s) && !isNaN(x.e));
      if (JSON.stringify(list) !== JSON.stringify(sportsEvents)) { sportsEvents = list; if (shownMeal === "Supper") shownMeal = null; }
      console.info("Sports loaded:", list.length, "events today");
    } catch (e) {
      console.warn("Sports could not be loaded:", e.message);
    }
  }

  async function loadFoodFromSheet() {
    try {
      const [header, ...rows] = await loadSheetTab(FOOD_TAB);
      const h = header.map(x => x.toLowerCase());
      const c = n => h.indexOf(n);
      const d = new Date();
      const todayKey = pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear();
      const menus = { BIC: [], Lunch: [], Supper: [] };
      rows.filter(r => (r[c("date")] || "").trim() === todayKey && (r[c("name")] || "").trim()).forEach(r => {
        const meal = (r[c("meal")] || "").trim();
        if (!menus[meal]) return;
        menus[meal].push({ name: r[c("name")].trim(), img: (r[c("photo")] || "").trim(),
          kcal: +r[c("kcal")] || 0, carbs: +r[c("carbs")] || 0, protein: +r[c("protein")] || 0, fat: +r[c("fat")] || 0 });
      });
      if (JSON.stringify(menus) !== JSON.stringify(foodMenus)) setFoodMenus(menus);
      console.info("Food menu loaded: BIC", menus.BIC.length, "| Lunch", menus.Lunch.length, "| Supper", menus.Supper.length);
    } catch (e) {
      console.warn("Food menu could not be loaded:", e.message);
    }
  }

  function setSegments(list) {
    segments = list.filter(x => !isNaN(x.s) && !isNaN(x.e) && x.e > x.s).sort((a, b) => a.s - b.s);
    chooseCountdown();
  }

  // ================= Period bar =================
  const periodsEl = document.getElementById("periods");
  let periodList = [];      // [{label, s, e}] with s/e in minutes after midnight
  let lastPeriodKey = "";

  function toMin(str) {
    const m = String(str).trim().match(/^(\d{1,2}):(\d{2})\s*([ap]m?)?$/i);
    if (!m) return NaN;
    let h = +m[1]; const min = +m[2]; const ap = (m[3] || "").toLowerCase();
    if (ap.startsWith("p") && h < 12) h += 12;
    if (ap.startsWith("a") && h === 12) h = 0;
    return h * 60 + min;
  }
  function fmt12(min) {
    min = ((Math.round(min) % 1440) + 1440) % 1440;
    const h = Math.floor(min / 60), m = min % 60;
    return (h % 12 || 12) + ":" + pad(m);
  }

  // Period bar boxes: class segments only; one period split into two entries becomes one box
  function mergeClasses(segs) {
    const out = [];
    segs.filter(x => x.label).forEach(x => {
      const prev = out[out.length - 1];
      if (prev && prev.label === x.label && prev.e === x.s) prev.e = x.e;
      else out.push({ label: x.label, s: x.s, e: x.e });
    });
    return out;
  }

  function setPeriods(list) {
    periodList = list
      .map(p => ({ label: p.label, s: typeof p.s === "number" ? p.s : toMin(p.start), e: typeof p.e === "number" ? p.e : toMin(p.end) }))
      .filter(p => p.label && !isNaN(p.s) && !isNaN(p.e));
    periodsEl.innerHTML = periodList.map((p, i) =>
      '<div class="pbox" data-i="' + i + '"><span class="pl">' + esc(p.label) + '</span><span class="pt">' +
      fmt12(p.s) + "\u2013" + fmt12(p.e) + "</span></div>").join("");
    lastPeriodKey = "";
  }

  // Which period is on now, and which is next (only during a passing period)
  function periodState(t) {
    let now = null, next = null;
    for (let i = 0; i < periodList.length; i++) {
      if (t >= periodList[i].s && t < periodList[i].e) { now = i; break; }
    }
    if (now === null && periodList.length && t >= periodList[0].s && t < periodList[periodList.length - 1].e) {
      next = periodList.findIndex(p => p.s > t);
      if (next < 0) next = null;
    }
    return { now, next };
  }

  function updatePeriods(d) {
    if (!periodList.length) return;
    const t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    const st = periodState(t);
    const key = st.now + "|" + st.next + "|" + periodList.filter(p => t >= p.e).length;
    if (key === lastPeriodKey) return;
    lastPeriodKey = key;
    periodsEl.querySelectorAll(".pbox").forEach((el, i) => {
      el.classList.toggle("now", i === st.now);
      el.classList.toggle("next", i === st.next);
      el.classList.toggle("past", t >= periodList[i].e && i !== st.now);
    });
  }

  if (DEMO) {
    // Preview only: a sample day shifted so "now" is 37 minutes into Period 3 (about 10 min left)
    const d = new Date();
    const t = d.getHours() * 60 + d.getMinutes();
    const p3 = t - 37, len = 47, gap = 7;
    const segs = [];
    for (let i = 0; i < 6; i++) {
      const s = p3 + (i - 2) * (len + gap) + (i >= 3 ? 30 : 0);   // lunch after P3
      const n = i + 1;
      segs.push({ s, e: s + len, name: "Period " + n + (n === 1 ? "" : " (ATTENDANCE @ 32)"), kind: "class", label: "P" + n });
      if (i === 2) segs.push({ s: s + len, e: s + len + 30, name: "Lunch", kind: "break", label: "" });
      if (i < 5) {
        const ps = i === 2 ? s + len + 30 : s + len;
        segs.push({ s: ps, e: ps + gap, name: "Passing to Period " + (n + 1), kind: "passing", label: "" });
      }
    }
    // keep the sample lunch from overlapping: rebuild start times in order
    segs.sort((a, b) => a.s - b.s);
    for (let i = 1; i < segs.length; i++) { const dur = segs[i].e - segs[i].s; segs[i].s = segs[i - 1].e; segs[i].e = segs[i].s + dur; }
    // Mockup scene: where "now" falls in the sample day
    const firstC = segs.find(x => x.kind === "class"), lastC = segs.filter(x => x.kind === "class").pop();
    const ln = segs.find(x => /lunch/i.test(x.name));
    const anchor = DEMO_SCENE === "bic" ? firstC.s - 22 : DEMO_SCENE === "supper" ? lastC.e + 12 : DEMO_SCENE === "class" ? firstC.s + 20 :
                   DEMO_SCENE === "out" ? lastC.e + 285 : ln.s + 8;
    const shift = t - anchor;
    segs.forEach(x => { x.s += shift; x.e += shift; });
    const lastEnd = lastC.e;
    segs.push({ s: lastEnd, e: lastEnd + 270, name: "EDUCARE (Chairs up on Thursday!)", kind: "break", label: "" });
    setSegments(segs);
    setPeriods(mergeClasses(segs));
    // Sample school calendar: tomorrow is Veteran's Day (no school). Scene "off" = today is a holiday
    // in the middle of Thanksgiving week, back the following Monday.
    {
      const base = new Date();
      const mark = (n, school, reason) => { schoolDays[dayKey(addDays(base, n))] = { school, reason }; };
      for (let i = -3; i <= 14; i++) { const d = addDays(base, i); mark(i, !isWeekend(d), isWeekend(d) ? "Weekend" : ""); }
      if (DEMO_SCENE === "off") {
        let i = 0, n = 0;
        while (n < 5 && i < 14) { if (!isWeekend(addDays(base, i))) { mark(i, false, n < 3 ? "No School- Unassigned Day" : "Thanksgiving Holiday"); n++; } i++; }
      } else {
        let i = 1; while (isWeekend(addDays(base, i))) i++;
        mark(i, false, "No School- Veteran's Day");
      }
      dailyItems = [
        { time: "", title: "Movember Presentations (Day 2/2)", where: "" },
        { time: "", title: "Blood Drive - Biotech", where: "Small Gym" },
        { time: "2:30", title: "Professional Development", where: "" },
        { time: "3:30", title: "Faculty Meeting", where: "Spartan Hall" }
      ];
    }
    // Today's real SCHS Athletics Calendar (Nov 10, 2026), as the sheet script copies it
    sportsEvents = [
      { s: 6 * 60 + 30, e: 8 * 60, title: "Baseball - Weightroom Educare", where: "Weightroom" },
      { s: 15 * 60 + 30, e: 17 * 60 + 30, title: "G Basketball Practice", where: "Gym" },
      { s: 15 * 60 + 30, e: 17 * 60 + 15, title: "JV Baseball Practice - Permit", where: "Baseball Field" },
      { s: 15 * 60 + 30, e: 17 * 60 + 15, title: "V Baseball Practice - Permit", where: "Baseball Field" },
      { s: 17 * 60 + 30, e: 19 * 60 + 30, title: "B Basketball Practice", where: "Gym" },
      { s: 18 * 60, e: 20 * 60 + 30, title: "B Volleyball Practice - Permit", where: "Big Gym & Sm Gym" }
    ];
    // Today's real menus (Nov 10, 2026) from Yumyummi, as the sheet script copies them.
    // Blank photo = Yumyummi only has a placeholder, so the Cafe LA logo is shown.
    const Y = "https://apiliquidweb.yumyummi.com/uploads/images/dishes/";
    setFoodMenus({
      BIC: [
        { name: "Fiesta Bean and Cheese Burrito PREP", img: Y + "fiesta-bean-cheese-burrito--1660434869-ph.jpg", kcal: 214, carbs: 29.9, protein: 9.2, fat: 6.4 },
        { name: "Fresh Salsa PREP", img: "", kcal: 8.3, carbs: 1.7, protein: 0.1, fat: 0 },
        { name: "Deluxe Cereal Bowl", img: Y + "deluxe-cereal-bowl-1660433345-ph.jpg", kcal: 261.6, carbs: 45.4, protein: 3.8, fat: 4.2 },
        { name: "Fresh Fruit", img: Y + "fresh-fruit-1660416233-ph.jpg", kcal: 76.6, carbs: 18.9, protein: 0.6, fat: 0.1 },
        { name: "Fruit Juice", img: "", kcal: 56.7, carbs: 14.5, protein: 0.3, fat: 0 },
        { name: "Peachy Peaches", img: "", kcal: 59.6, carbs: 13.9, protein: 0, fat: 0 }
      ],
      Lunch: [
        { name: "Chicken Drumstick and Mashed Potatoes PREP", img: "", kcal: 288.51, carbs: 24.38, protein: 18.38, fat: 12.59 },
        { name: "Honey Biscuit PREP", img: Y + "honey-biscuit-1660418430-ph.jpg", kcal: 190, carbs: 30, protein: 4, fat: 6 },
        { name: "Beef Birria Burrito", img: Y + "beef-birria-burrito-1759329393-ph.jpg", kcal: 488.98, carbs: 56.61, protein: 27.88, fat: 14.61 },
        { name: "Beef Birria Bowl PREP", img: Y + "beef-birria-bowl-prep-1747860228-ph.jpg", kcal: 528, carbs: 76.56, protein: 25.68, fat: 12.98 },
        { name: "Chikn Nuggets VEGAN PREP", img: Y + "chicken-nuggets-1660130345-ph.jpg", kcal: 247.23, carbs: 24.72, protein: 14.83, fat: 11.12 },
        { name: "Buffalo Chikn Nuggets VEGAN", img: "", kcal: 221.17, carbs: 22.12, protein: 14.1, fat: 8.04 },
        { name: "Fresh Fruit", img: Y + "fresh-fruit-1660416233-ph.jpg", kcal: 76.57, carbs: 18.91, protein: 0.57, fat: 0.1 }
      ],
      Supper: [
        { name: "Bean and Cheese Pupusa PREP", img: Y + "bean-cheese-pupusa--1660347516-ph.jpg", kcal: 290, carbs: 35, protein: 13, fat: 11 },
        { name: "Fresh Curtido PREP", img: "", kcal: 6.6, carbs: 1.6, protein: 0.2, fat: 0 },
        { name: "Turkey Stick", img: "", kcal: 40, carbs: 0, protein: 8, fat: 1 },
        { name: "String Cheese", img: "", kcal: 90, carbs: 0, protein: 7, fat: 7 },
        { name: "Cheez-It Crackers", img: "", kcal: 100, carbs: 14, protein: 3, fat: 3.5 },
        { name: "Fresh Fruit", img: Y + "fresh-fruit-1660416233-ph.jpg", kcal: 76.6, carbs: 18.9, protein: 0.6, fat: 0.1 }
      ]
    });
  } else {
    if (!PERIODS_TAB || !ANNOUNCEMENTS_SHEET_ID) setPeriods(PERIODS);
  }

  // ================= Announcement ticker =================
  const tickerEl = document.getElementById("ticker");
  const runEl = document.getElementById("tickerRun");
  let announcements = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Minimal CSV parser (handles quoted fields, commas and line breaks inside quotes)
  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') q = false;
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function activeToday(start, end) {
    const now = new Date();
    if (start) { const s = new Date(start); if (!isNaN(s) && now < s) return false; }
    if (end)   { const e = new Date(end);   if (!isNaN(e)) { e.setHours(23, 59, 59, 999); if (now > e) return false; } }
    return true;
  }

  function rowsToAnnouncements(rows) {
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim().toLowerCase());
    const col = (name, fallback) => { const i = head.indexOf(name); return i >= 0 ? i : fallback; };
    const iMsg = col("message", 0), iStart = col("start", 1), iEnd = col("end", 2), iSrc = col("source", 3);
    return rows.slice(1)
      .map(r => ({ message: (r[iMsg] || "").trim(), start: (r[iStart] || "").trim(), end: (r[iEnd] || "").trim(), source: (r[iSrc] || "").trim() }))
      .filter(a => a.message && activeToday(a.start, a.end));
  }

  function itemHTML(a) {
    let badge = "";
    const icon = SOURCE_ICONS[(a.source || "").trim().toLowerCase()];
    if (/instagram/i.test(a.source)) badge = '<span class="badge ig">Instagram</span>';
    else if (icon) badge = '<span class="badge icon" role="img" aria-label="' + esc(a.source) + '" title="' + esc(a.source) + '">' + icon + "</span>";
    else if (a.source) badge = '<span class="badge">' + esc(a.source) + "</span>";
    return '<span class="item">' + badge + "<span>" + esc(a.message) + "</span></span>";
  }

  // Announcements with today's school-calendar items in between: A1, C1, A2, C2, ...
  function tickerItems() {
    const cal = [];
    const notice = tomorrowNotice();
    if (notice) cal.push({ message: notice, source: "Calendar" });
    dailyItems.forEach(x => cal.push({ message: (x.time ? x.time + " " : "") + x.title + (x.where ? " \u00b7 " + x.where : ""), source: "Calendar" }));
    const out = [];
    for (let i = 0; i < Math.max(announcements.length, cal.length); i++) {
      if (i < announcements.length) out.push(announcements[i]);
      if (i < cal.length) out.push(cal[i]);
    }
    return out;
  }

  function renderTicker() {
    const items = tickerItems();
    if (!items.length) { tickerEl.classList.add("empty"); runEl.innerHTML = ""; loopW = 0; return; }
    tickerEl.classList.remove("empty");
    if (!prefs.ticker) return;

    // Build one "set", repeat it until it's wider than the track, then double it for a seamless loop
    const one = items.map(itemHTML).join("");
    runEl.innerHTML = one;
    const trackW = runEl.parentElement.clientWidth || window.innerWidth;
    let set = one, guard = 0;
    while (runEl.scrollWidth < trackW && guard++ < 20) { set += one; runEl.innerHTML = set; }
    runEl.innerHTML = set + set;
    loopW = runEl.scrollWidth / 2;
    tickerOffset = wrapOffset(tickerOffset);
    runEl.style.transform = "translateX(" + tickerOffset + "px)";
  }

  // ---- Ticker motion: scrolls on its own; click/touch and drag to scrub back and forth ----
  // After letting go it glides to a stop, waits a few seconds, then resumes scrolling.
  const RESUME_AFTER_MS = 4000;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let loopW = 0, tickerOffset = 0, lastFrame = 0;
  let dragging = false, dragStartX = 0, dragStartOffset = 0, velocity = 0, lastMoveX = 0, lastMoveT = 0, resumeAt = 0;

  function wrapOffset(x) {
    if (!loopW) return 0;
    x = x % loopW;
    return x > 0 ? x - loopW : x;     // keep within (-loopW, 0]
  }

  function tickerFrame(now) {
    const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    if (loopW && !dragging && !tickerEl.classList.contains("empty")) {
      if (Math.abs(velocity) > 5) {                 // glide after a fling
        tickerOffset += velocity * dt;
        velocity *= Math.pow(0.04, dt);             // friction
      } else if (now >= resumeAt && !reduceMotion) {
        velocity = 0;
        tickerOffset -= TICKER_SPEED * dt;          // normal auto-scroll
      }
      tickerOffset = wrapOffset(tickerOffset);
      runEl.style.transform = "translateX(" + tickerOffset + "px)";
    }
    tickerEl.classList.toggle("held", !dragging && now < resumeAt);
    requestAnimationFrame(tickerFrame);
  }
  requestAnimationFrame(tickerFrame);

  const trackEl = runEl.parentElement;
  trackEl.addEventListener("pointerdown", (e) => {
    if (!loopW) return;
    dragging = true; velocity = 0;
    dragStartX = lastMoveX = e.clientX; dragStartOffset = tickerOffset; lastMoveT = performance.now();
    tickerEl.classList.add("dragging");
    trackEl.setPointerCapture(e.pointerId);
  });
  trackEl.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now();
    const dx = e.clientX - lastMoveX, dtm = (now - lastMoveT) / 1000;
    if (dtm > 0) velocity = 0.8 * (dx / dtm) + 0.2 * velocity;   // smoothed speed for the fling
    lastMoveX = e.clientX; lastMoveT = now;
    tickerOffset = wrapOffset(dragStartOffset + (e.clientX - dragStartX));
    runEl.style.transform = "translateX(" + tickerOffset + "px)";
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    tickerEl.classList.remove("dragging");
    if (performance.now() - lastMoveT > 120) velocity = 0;      // held still before letting go: no fling
    velocity = Math.max(-3000, Math.min(3000, velocity));
    resumeAt = performance.now() + RESUME_AFTER_MS;
    try { trackEl.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  trackEl.addEventListener("pointerup", endDrag);
  trackEl.addEventListener("pointercancel", endDrag);
  // Mouse wheel / trackpad also scrubs
  trackEl.addEventListener("wheel", (e) => {
    if (!loopW) return;
    e.preventDefault();
    tickerOffset = wrapOffset(tickerOffset - (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY));
    runEl.style.transform = "translateX(" + tickerOffset + "px)";
    velocity = 0;
    resumeAt = performance.now() + RESUME_AFTER_MS;
  }, { passive: false });

  // Main method: load the sheet through Google's chart-data service with a <script> tag.
  // Script tags aren't subject to the cross-site blocking that stops fetch() on published CSVs.
  let gvizCount = 0;
  function loadViaSheetScript() {
    return loadSheetTab(ANNOUNCEMENTS_TAB).then(rowsToAnnouncements);
  }

  // Loads one tab of the sheet; resolves to [headerRow, ...rows] as text
  function loadSheetTab(tabName) {
    return new Promise((resolve, reject) => {
      const cb = "__bellSheetCb" + (++gvizCount);
      const s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(new Error("Timed out loading the sheet")); }, 15000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (resp) => {
        cleanup();
        if (!resp || resp.status === "error") {
          const msg = resp && resp.errors && resp.errors[0] ? (resp.errors[0].detailed_message || resp.errors[0].message) : "unknown error";
          return reject(new Error("Sheet error: " + msg));
        }
        const t = resp.table;
        const header = t.cols.map(c => (c.label || "").trim());
        const rows = (t.rows || []).map(r => (r.c || []).map(cell => {
          if (!cell) return "";
          if (cell.f != null) return String(cell.f);   // formatted value (e.g. 11/13/2026)
          return cell.v == null ? "" : String(cell.v);
        }));
        resolve([header, ...rows]);
      };
      s.onerror = () => { cleanup(); reject(new Error("Sheet could not be reached (check sharing: Anyone with the link can view)")); };
      s.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(ANNOUNCEMENTS_SHEET_ID) +
              "/gviz/tq?headers=1&sheet=" + encodeURIComponent(tabName) +
              "&tqx=responseHandler:" + cb + "&t=" + Date.now();
      document.head.appendChild(s);
    });
  }

  // ---- Period bar from the "Bell Periods" tab ----
  let periodsKey = null;
  async function loadPeriodsFromSheet() {
    try {
      const [header, ...rows] = await loadSheetTab(PERIODS_TAB);
      const h = header.map(x => x.toLowerCase());
      const col = n => h.indexOf(n);
      const iDate = col("date"), iLabel = col("label"), iStart = col("start"), iEnd = col("end"), iName = col("name"), iKind = col("kind"), iSched = col("schedule");
      const d = new Date();
      const todayKey = pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear();
      // Only use rows written for today, so a stopped script never shows yesterday's schedule
      const todays = rows.filter(r => (r[iDate] || "").trim() === todayKey && (r[iStart] || "").trim());
      const segs = todays.map(r => ({
        s: toMin(r[iStart]), e: toMin(r[iEnd]),
        name: (r[iName] || "").trim(), kind: iKind >= 0 ? (r[iKind] || "").trim() : ((r[iLabel] || "").trim() ? "class" : ""),
        label: (r[iLabel] || "").trim()
      }));
      const key = JSON.stringify(segs);
      if (key !== periodsKey) {
        periodsKey = key;
        setSegments(iKind >= 0 ? segs : []);          // older sheet script (no Kind column): keep bell.plus countdown
        setPeriods(mergeClasses(segs));
      }
      const sched = rows.length && iSched >= 0 ? rows[0][iSched] : "";
      console.info("Schedule loaded:", segs.length, "segments", sched ? "(" + sched + ")" : "", rows.length && rows[0][iDate] !== todayKey ? "- sheet is not updated for today yet" : "");
    } catch (e) {
      console.warn("Schedule could not be loaded:", e.message);   // keep the last good data
    }
    if (!scheduleChecked) { scheduleChecked = true; chooseCountdown(); }
  }

  // Backup method: the published CSV link
  async function loadViaCSV() {
    const res = await fetch(ANNOUNCEMENTS_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return rowsToAnnouncements(parseCSV(await res.text()));
  }

  const OFF_RE = /\bno school\b|\b(holiday|recess)\s*$|\b(winter|spring|thanksgiving|summer)\s+break\b/i;
  async function loadSchoolCalendar() {
    try {
      const [h1, ...dayRows] = await loadSheetTab(SCHOOL_DAYS_TAB);
      const c1 = n => h1.map(x => x.toLowerCase()).indexOf(n);
      const days = {};
      dayRows.forEach(r => {
        const k = (r[c1("date")] || "").trim(); if (!k) return;
        days[k] = { school: /^(yes|true)$/i.test((r[c1("school")] || "").trim()), reason: (r[c1("reason")] || "").trim() };
      });
      const [h2, ...evRows] = await loadSheetTab(DAILY_TAB);
      const c2 = n => h2.map(x => x.toLowerCase()).indexOf(n);
      const today = dayKey(new Date());
      const items = evRows.filter(r => (r[c2("date")] || "").trim() === today && (r[c2("title")] || "").trim() && !OFF_RE.test(r[c2("title")]))
        .map(r => { const st = (r[c2("start")] || "").trim(); return { sort: st ? toMin(st) : -1, time: st ? fmt12(toMin(st)) : "", title: r[c2("title")].trim(), where: (r[c2("location")] || "").trim() }; })
        .sort((a, b) => a.sort - b.sort).map(({ time, title, where }) => ({ time, title, where }));
      const changed = JSON.stringify(days) !== JSON.stringify(schoolDays) || JSON.stringify(items) !== JSON.stringify(dailyItems);
      schoolDays = days; dailyItems = items;
      if (changed) { chooseCountdown(); renderTicker(); }
      console.info("School calendar loaded:", Object.keys(days).length, "days,", items.length, "items today");
    } catch (e) {
      console.warn("School calendar could not be loaded:", e.message);
    }
  }

  async function loadAnnouncements() {
    if (!ANNOUNCEMENTS_SHEET_ID && !ANNOUNCEMENTS_CSV_URL) {
      announcements = SAMPLE_ANNOUNCEMENTS.filter(a => activeToday(a.start, a.end));
      renderTicker();
      return;
    }
    let next = null, errors = [];
    if (ANNOUNCEMENTS_SHEET_ID) {
      try { next = await loadViaSheetScript(); } catch (e) { errors.push("Sheet: " + e.message); }
    }
    if (next === null && ANNOUNCEMENTS_CSV_URL) {
      try { next = await loadViaCSV(); } catch (e) { errors.push("CSV: " + e.message); }
    }
    if (next === null) {
      // Keep showing the last good list if the sheet can't be reached
      console.warn("Announcements could not be loaded.", errors.join(" | "));
      return;
    }
    console.info("Announcements loaded:", next.length, "showing today");
    if (JSON.stringify(next) !== JSON.stringify(announcements)) { announcements = next; renderTicker(); }
  }

  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderTicker, 250); });

  // ================= Start =================
  apply();
  setInterval(tick, 1000);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(loadAnnouncements);
  setInterval(loadAnnouncements, REFRESH_MINUTES * 60 * 1000);
  if (!DEMO && PERIODS_TAB && ANNOUNCEMENTS_SHEET_ID) {
    loadPeriodsFromSheet();
    setInterval(loadPeriodsFromSheet, REFRESH_MINUTES * 60 * 1000);
    if (FOOD_TAB) { loadFoodFromSheet(); setInterval(loadFoodFromSheet, 30 * 60 * 1000); }
    if (SPORTS_TAB) { loadSportsFromSheet(); setInterval(loadSportsFromSheet, 30 * 60 * 1000); }
    if (SCHOOL_DAYS_TAB) { loadSchoolCalendar(); setInterval(loadSchoolCalendar, 30 * 60 * 1000); }
  }
